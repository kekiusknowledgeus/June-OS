[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "june-os"
version = "0.1.0"
description = "Local-first June operating layer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.28",
  "python-dotenv>=1.0", "keyring>=25", "psutil>=6",
  "pillow>=11", "mss>=10", "playwright>=1.50",
  "pyautogui>=0.9.54", "pyperclip>=1.9", "pystray>=0.19",
  "numpy>=2.2", "tzdata>=2025.1", "sounddevice>=0.5",
  "pycaw>=20260927; sys_platform == 'win32'"
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25"]
v0 = ["torch>=2.5"]
camera = ["opencv-python>=4.11"]

[project.scripts]
june = "june.__main__:main"

[tool.setuptools.packages.find]
include = ["june*"]

[tool.setuptools.package-data]
june = ["web/*", "scripts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
